<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response Admin</title>
</head>
<body>
    <p>Opening the admin sign-in page. If you are not redirected, <a href="./?admin=1">continue here</a>.</p>
    <script>
        const destination = new URLSearchParams(window.location.search).get("reset") === "1"
            ? "./?reset=1"
            : "./?admin=1";
        window.location.replace(destination);
    </script>
</body>
</html>
